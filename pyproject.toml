[project]
name = "guap-teacher-mcp"
version = "0.1.0"
description = "MCP server for teacher-side automation of pro.guap.ru (GUAP Lichny Kabinet)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "openpyxl>=3.1.5",
]

[project.scripts]
guap-teacher = "guap_teacher_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guap_teacher_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
